name: Daily Google Ads Updates

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 北京时间 (UTC+8)
  workflow_dispatch:        # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch updates
        run: python fetch_updates.py

      - name: Commit & push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add index.html updates.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "chore: update $(date -u '+%Y-%m-%d')" && git push)
